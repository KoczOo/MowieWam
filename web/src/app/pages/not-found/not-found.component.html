<main class="not-found">

      <span class="eyebrow">Błąd 404</span>
      <h1 class="page-title">Nie znaleziono strony</h1>
      <p class="page-subtitle">
        Podany adres nie istnieje lub został przeniesiony. Wróć na stronę główną
        albo skorzystaj z menu.
      </p>
      <div class="page-actions">
        <a class="btn-mw btn-primary-mw" routerLink="/">

        <a class="btn-mw btn-outline-mw" routerLink="/kontakt">
          <mat-icon>mail</mat-icon>

        </a>
      </div>
    </div>
  </section>
</main>
